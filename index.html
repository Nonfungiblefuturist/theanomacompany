<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.jpeg" type="image/jpeg" />
    <title>The Anoma Company — AI-First Cinematic Production Studio | Toronto</title>
    <meta name="description" content="The Anoma Company is an AI-first cinematic production studio based in Toronto. We produce AI video, creative campaigns, and custom AI solutions for brands across North America, South Asia, and the Middle East." />
    <meta name="keywords" content="AI video production, AI-first studio, cinematic production, creative campaigns, AI solutions, Toronto production studio, AI commercial production, brand films, AI influencer, Anoma" />
    <meta name="author" content="The Anoma Company" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="en" />
    <meta name="geo.region" content="CA-ON" />
    <link rel="canonical" href="https://theanoma.company" />
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://calendar.google.com; connect-src 'self' https:; object-src 'none'; base-uri 'self';" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist from Google Fonts — async load -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- Preload hero video for fast LCP -->
    <link rel="preload" href="/videos/hero-bg.mov" as="video" type="video/mp4" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="The Anoma Company — AI-First Cinematic Production Studio" />
    <meta property="og:description" content="We don't just create content — we engineer experiences. AI video production, creative campaigns, and custom AI solutions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theanoma.company" />
    <meta property="og:image" content="https://theanoma.company/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="The Anoma Company" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Anoma Company — AI-First Cinematic Production Studio" />
    <meta name="twitter:description" content="AI video production, creative campaigns, and custom AI solutions. Based in Toronto." />
    <meta name="twitter:image" content="https://theanoma.company/og-image.jpg" />
    <meta name="twitter:creator" content="@theanomacompany" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "The Anoma Company",
      "description": "AI-first cinematic production studio based in Toronto. AI video production, creative campaigns, and custom AI solutions.",
      "url": "https://theanoma.company",
      "logo": "https://theanoma.company/images/anoma-logo.png",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Toronto",
        "addressRegion": "Ontario",
        "addressCountry": "CA"
      },
      "sameAs": [
        "https://www.instagram.com/theanomacompany/",
        "https://www.linkedin.com/company/the-anoma-company",
        "https://www.youtube.com/@CTRLplusAI/"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "admin@theanoma.company"
      },
      "areaServed": "Worldwide",
      "serviceType": [
        "AI Video Production",
        "Cinematic Commercial Production",
        "Creative Campaigns",
        "AI Solutions",
        "Branding & Visual Identity"
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
</html>
